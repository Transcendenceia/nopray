# ── Fixed slots (0x400000 .. 0x407FFF) ────────────────────────────────────────
[[slot]]
name = "elf_header"
kind = "header"
vaddr = 0x400000
size = 0x100
file = "slots/0000_elf_header.hex"
purpose = "ELF64 header + PT_LOAD r-x (32 KiB) + PT_LOAD rw- (1.5 MiB .bss) + PT_GNU_STACK rw-"

[[slot]]
name = "io_helpers"
kind = "code"
vaddr = 0x400100
size = 0x80
file = "slots/0100_io_helpers.hex"
purpose = "Syscall wrappers: read_exact (+0x00), write_all (+0x30), exit_clean (+0x60)"
[[slot.label]]
name = "read_exact"
offset = 0x0
entry = false
note = "Read exact byte count from fd (slot start alias)"
[[slot.label]]
name = "write_all"
offset = 0x30
entry = true
note = "Write exact byte count to fd"
[[slot.label]]
name = "exit_clean"
offset = 0x60
entry = true
note = "Clean exit(0)"

[[slot]]
name = "start"
kind = "code"
vaddr = 0x400180
size = 0x300
file = "slots/0180_start.hex"
purpose = "Pin r15=0x408000; X11 connect + handshake; CreateWindow 640x400; WM_NAME, WM_NORMAL_HINTS, CreateGC, MapWindow; init textures/sprites/level; jmp main_loop"
[slot.contract]
calls = ["io_helpers", "write_all", "init_textures", "init_sprites", "reset_level", "audio_engine"]
clobbers = ["rax", "rbx", "rcx", "rdx", "rsi", "rdi", "r11", "r15"]
noreturn = true

[[slot]]
name = "init_textures"
kind = "code"
vaddr = 0x400480
size = 0x580
file = "slots/0480_init_textures.hex"
purpose = "Generate 7 procedural 64x64 BGRA TranscendenceIA textures at 0x510000 (obsidian panel, spectral conduit, ember reactor, violet monolith, cyber blast door, floor grid, ceiling panels)"
[slot.contract]
calls = []
clobbers = ["rax", "rbx", "rcx", "rdx", "rsi", "rdi", "r8", "r9", "r10", "r11", "r12", "r13", "r14", "rbp"]

