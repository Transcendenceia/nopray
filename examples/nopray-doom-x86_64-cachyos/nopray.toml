[app]
name = "nopray-doom"
version = "1.0.0"
standard = "DMCS-1.1"
tier = "L2"
exposure = "local"
description = "Transcendence DOOM: 32 KiB pure hand-authored x86-64 FPS engine (X11 640x400, procedural 64x64 wall/floor/ceiling textures, Z-buffered 3D sprites, Sentinel AI + fireballs, sliding doors, animated plasma cannon, HUD & minimap, W^X, 6 syscalls)."

[target]
isa = "x86-64"
os = "linux"
format = "elf64"
base = 0x400000
entry = "start"
output = "nopray-doom"
file_size = 0x8000
state_register = "r15"
state_base = 0x408000

[syscalls]
allow = ["socket", "connect", "read", "write", "poll", "exit"]

[provenance]
authored_by = "Angie (AI agent) & Marlon Basayo — TranscendenceIA"
method = "Every x86-64 instruction opcode and ELF header byte authored by hand in hexadecimal; helper arithmetic resolves only @label branch displacements and declared rodata addresses. Attestation backed by DMCS-1.1 strict audit."
date = "2026-11-26"

[[segment]]
name = "text"
vaddr = 0x400000
offset = 0x0
file_size = 0x8000
mem_size = 0x8000
perms = "r-x"
align = 0x1000

[[segment]]
name = "bss"
vaddr = 0x408000
offset = 0x0
file_size = 0x0
mem_size = 0x180000
perms = "rw-"
align = 0x1000

