# Baseline map only. Not a hand-authored firmware and not a completed function-level port.
[app]
name = "La Aguja IoT S3 prebuilt reference"
version = "1.4.0"
standard = "DMCS-1.1"
tier = "L1"
exposure = "local"
description = "Byte-exact loader-segment import of an ESP-IDF-built S3 application; opaque reference only."

[target]
isa = "xtensa"
os = "bare-metal"
format = "raw"
base = 0
entry = "app_entry"
output = "aguja-iot-s3-reference.bin"
file_size = 0x11d1c0

[provenance]
authored_by = "La Aguja IoT upstream, not Angie"
method = "Imported pre-existing compilation, ESP-IDF v5.5.6; only loader-segment bounds are mapped. SHA-256 e8a1c9dddfbc31d574071f3460df2636a2bf13daca29c33af8b4211b20cafbf3."
date = "2026-11-27"

