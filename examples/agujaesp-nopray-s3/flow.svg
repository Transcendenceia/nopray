<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">AgujaESP-NOPRAY: ROM boot and future network boundaries</title>
  <desc id="desc">A verified lane connects a hand-authored 160 byte image to emulated ESP32-S3 SPI boot and real-board RAM execution, both confirmed by UART. A separate planned lane shows Wi-Fi, Headscale coordination, WireGuard peer traffic and signed updates.</desc>
  <defs>
    <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28d9f7"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d9afff"/></marker>
    <style>
      text {font-family:Inter,"Noto Sans",sans-serif;fill:#f7f6f1}
      .eyebrow {font-size:17px;font-weight:700;letter-spacing:2px}
      .heading {font-size:49px;font-weight:760;letter-spacing:-1px}
      .label {font-size:23px;font-weight:700}
      .body {font-size:17px;fill:#c2c4ce}
      .mini {font-size:15px;fill:#c2c4ce}
      .box {fill:#191d26;stroke:#887299;stroke-width:1.25}
      .cyan {fill:#28d9f7}
      .violet {fill:#d9afff}
      .data {stroke:#28d9f7;stroke-width:2.5;fill:none;marker-end:url(#cyan)}
      .future {stroke:#d9afff;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#violet)}
    </style>
  </defs>
  <rect width="1100" height="720" rx="14" fill="#090b10"/>
  <line x1="46" x2="1054" y1="30" y2="30" stroke="#ff4b0a" stroke-width="2"/>
  <text x="46" y="65" class="eyebrow" fill="#ffad8a">NOPRAY / ESP32-S3</text>
  <text x="46" y="121" class="heading">From hex to a tailnet node</text>
  <rect x="46" y="147" width="1008" height="188" rx="12" fill="#11141b"/>
  <text x="70" y="184" class="eyebrow cyan">01 / VERIFIED: QEMU SPI BOOT + PHYSICAL RAM LOAD</text>
  <path d="M338 260H412" class="data"/>
  <path d="M682 260H756" class="data"/>
  <g class="box">
    <rect x="70" y="211" width="268" height="98" rx="9"/>
    <rect x="414" y="211" width="268" height="98" rx="9"/>
    <rect x="758" y="211" width="272" height="98" rx="9"/>
  </g>
  <text x="94" y="250" class="label">160-byte image</text>
  <text x="94" y="279" class="body">Literal hex · mapped slots</text>
  <text x="438" y="250" class="label">Espressif ROM</text>
  <text x="438" y="279" class="body">SPI (QEMU) / RAM (board)</text>
  <text x="782" y="250" class="label">UART0 evidence</text>
  <text x="782" y="279" class="body">Same marker on both</text>

  <rect x="46" y="354" width="1008" height="316" rx="12" fill="#11141b"/>
  <text x="70" y="392" class="eyebrow violet">02 / DESIGN ONLY · NOT IMPLEMENTED</text>
  <path d="M321 481H421" class="future"/>
  <path d="M663 481H780" class="future"/>
  <path d="M544 535V571H780" class="future"/>
  <g class="box">
    <rect x="70" y="428" width="251" height="107" rx="9"/>
    <rect x="423" y="428" width="240" height="107" rx="9"/>
    <rect x="782" y="428" width="248" height="94" rx="9"/>
    <rect x="782" y="540" width="248" height="102" rx="9"/>
  </g>
  <text x="94" y="469" class="label">Wi-Fi STA + IP</text>
  <text x="94" y="502" class="body">Association on real radio</text>
  <text x="447" y="469" class="label">ESP node</text>
  <text x="447" y="502" class="body">Identity + local config</text>
  <text x="806" y="463" class="label">Headscale</text>
  <text x="806" y="493" class="body">Enrollment + netmap</text>
  <text x="806" y="576" class="label">Authorized peer</text>
  <text x="806" y="605" class="body">WireGuard · config · OTA</text>
  <text x="687" y="467" class="mini">control</text>
  <text x="589" y="559" class="mini">data path</text>
  <text x="70" y="640" class="mini">Release gate: signed firmware, A/B boot, rollback tested.</text>
  <text x="46" y="699" class="mini">Solid: observed. Dashed: proposed; Headscale does not forward peer traffic.</text>
</svg>
