[app]
name = "hello-aarch64"
version = "1.0.0"
standard = "DMCS-1.1"
tier = "L2"
exposure = "local"
description = "Minimal AArch64 Linux program (Raspberry Pi OS arm64 userland): write(1, msg, 18); exit(0). One r-x PT_LOAD aligned to 64 KiB so it also loads on 16K/64K-page kernels (Pi 5), plus an explicit non-executable stack."

[target]
isa = "aarch64"
os = "linux"
format = "elf64"
base = 0x400000
entry = "_start"
output = "hello-aarch64"
file_size = 0x180

[[segment]]
name = "text"
vaddr = 0x400000
offset = 0x0
file_size = 0x180
mem_size = 0x180
perms = "r-x"
align = 0x10000

[syscalls]
allow = ["write", "exit"]

[provenance]
authored_by = "Angie (AI agent)"
method = "Every byte written as hex by hand from the ARMv8-A encoding tables; nopray only laid out and decoded."
date = "2026-11-24"

[[slot]]
name = "elf_header"
kind = "header"
vaddr = 0x400000
size = 0x100
file = "slots/0000_elf_header.hex"
purpose = "ELF64 header (EM_AARCH64) + PT_LOAD r-x (align 64 KiB) + PT_GNU_STACK rw-"

[[slot]]
name = "_start"
kind = "code"
vaddr = 0x400100
size = 0x40
file = "slots/0100_start.hex"
purpose = "write(1, msg, 18) then exit(0)"
[slot.contract]
noreturn = true

[[slot]]
name = "rodata"
kind = "rodata"
vaddr = 0x400140
size = 0x40
file = "slots/0140_rodata.hex"
purpose = "Message bytes"
[[slot.label]]
name = "msg"
offset = 0x0
note = "\"NOPRAY aarch64 OK\\n\", 18 bytes"
