  <rect x="130" y="150" width="10" height="10" fill="#E3B189"/>
  <rect x="70" y="160" width="100" height="10" fill="#DCE4F5"/>
  <rect x="50" y="170" width="140" height="10" fill="#DCE4F5"/>
  <rect x="40" y="180" width="160" height="40" fill="#DCE4F5"/>
  <!-- Tunic subtle fold shading -->
  <rect x="40" y="180" width="10" height="40" fill="#B6C3DE"/>
  <rect x="190" y="180" width="10" height="40" fill="#B6C3DE"/>
  <rect x="150" y="190" width="10" height="30" fill="#C7D2E8"/>

  <!-- Crimson Mantle Sash (diagonal across tunic) -->
  <rect x="60" y="160" width="30" height="10" fill="#D63B4D"/>
  <rect x="50" y="170" width="50" height="10" fill="#E64553"/>
  <rect x="60" y="180" width="50" height="10" fill="#E64553"/>
  <rect x="70" y="190" width="50" height="10" fill="#D63B4D"/>
  <rect x="80" y="200" width="50" height="10" fill="#E64553"/>
  <rect x="90" y="210" width="50" height="10" fill="#D63B4D"/>
  <!-- Mantle highlight edge -->
  <rect x="70" y="170" width="10" height="10" fill="#F38BA8"/>
  <rect x="80" y="180" width="10" height="10" fill="#F38BA8"/>
  <rect x="90" y="190" width="10" height="10" fill="#F38BA8"/>
  <rect x="100" y="200" width="10" height="10" fill="#F38BA8"/>

  <!-- Radiant Sacred Silicon Spark on Chest (Direct-to-CPU Heart) -->
  <rect x="110" y="180" width="20" height="20" fill="#F5C242"/>
  <rect x="115" y="185" width="10" height="10" fill="#FFF2B2"/>
  <rect x="118" y="175" width="4" height="5" fill="#F9E2AF"/>
  <rect x="118" y="200" width="4" height="5" fill="#F9E2AF"/>
  <rect x="105" y="188" width="5" height="4" fill="#F9E2AF"/>
  <rect x="130" y="188" width="5" height="4" fill="#F9E2AF"/>
